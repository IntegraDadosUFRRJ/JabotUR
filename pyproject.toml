[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jabotur-scripts"
version = "0.1.0"
description = "ETL Pipeline scripts for JabotUR"
dependencies = [
    "pandas",
    "sqlalchemy",
    "psycopg2-binary",
    "duckdb",
    "openpyxl"
]

[tool.setuptools.packages.find]
include = ["scripts", "scripts.*"]
