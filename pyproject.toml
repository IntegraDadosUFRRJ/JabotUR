[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jabotur-scripts"
version = "0.1.0"
description = "ETL Pipeline scripts for JabotUR"
dependencies = [
    "pandas",
    "sqlalchemy",
    "psycopg2-binary",
    "duckdb",
    "openpyxl"
]

[tool.setuptools.packages.find]
include = ["scripts", "scripts.*"]

# Os .sql são lidos em tempo de execução ao lado dos módulos (Path(__file__).with_name)
[tool.setuptools.package-data]
"scripts.db" = ["schema.sql"]
"scripts.clean" = ["*.sql"]
